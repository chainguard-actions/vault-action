name: Test multiple secrets with custom names
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Vault
        run: |
          wget -q -O /tmp/vault.zip https://releases.hashicorp.com/vault/1.13.3/vault_1.13.3_linux_amd64.zip
          unzip -q /tmp/vault.zip -d /usr/local/bin/
          vault version

      - name: Start Vault in dev mode
        run: |
          vault server -dev -dev-root-token-id=testtoken -dev-listen-address=127.0.0.1:8200 &
          echo $! > /tmp/vault.pid
          export VAULT_ADDR=http://127.0.0.1:8200
          for i in $(seq 1 30); do
            vault status && break || sleep 1
          done

      - name: Seed Vault with test secrets
        run: |
          export VAULT_ADDR=http://127.0.0.1:8200
          export VAULT_TOKEN=testtoken
          vault kv put secret/app username=admin password=s3cr3t
          vault kv put secret/db host=localhost port=5432

      - id: vault
        uses: .
        with:
          url: http://127.0.0.1:8200
          token: testtoken
          secrets: |
            secret/data/app username | APP_USER ;
            secret/data/app password | APP_PASS ;
            secret/data/db host | DB_HOST

      - name: Assert APP_USER
        run: |
          echo "APP_USER: $APP_USER"
          if [ "$APP_USER" != "admin" ]; then
            echo "FAIL: expected APP_USER=admin, got: $APP_USER"
            exit 1
          fi
          echo "PASS"

      - name: Assert APP_PASS
        run: |
          echo "APP_PASS is set: $([ -n "$APP_PASS" ] && echo yes || echo no)"
          if [ "$APP_PASS" != "s3cr3t" ]; then
            echo "FAIL: expected APP_PASS=s3cr3t, got: $APP_PASS"
            exit 1
          fi
          echo "PASS"

      - name: Assert DB_HOST
        run: |
          echo "DB_HOST: $DB_HOST"
          if [ "$DB_HOST" != "localhost" ]; then
            echo "FAIL: expected DB_HOST=localhost, got: $DB_HOST"
            exit 1
          fi
          echo "PASS"
