name: Test multiple secrets retrieval with remapping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault:1.15.0
        env:
          VAULT_DEV_ROOT_TOKEN_ID: testtoken
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Wait for Vault to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health > /dev/null 2>&1; then
              echo "Vault is ready"
              break
            fi
            echo "Waiting for Vault... attempt $i"
            sleep 2
          done

      - name: Seed Vault with test secrets
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: testtoken
        run: |
          # Write first secret
          curl -sf -X POST \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"data":{"alpha":"VALUE_ALPHA","beta":"VALUE_BETA"}}' \
            "$VAULT_ADDR/v1/secret/data/multi"

          # Write second secret at nested path
          curl -sf -X POST \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"data":{"gamma":"VALUE_GAMMA"}}' \
            "$VAULT_ADDR/v1/secret/data/nested/multi"

          echo "Secrets written successfully"

      - id: vault
        uses: .
        with:
          url: http://127.0.0.1:8200
          token: testtoken
          secrets: |
            secret/data/multi alpha | ALPHA_OUT ;
            secret/data/multi beta | BETA_OUT ;
            secret/data/nested/multi gamma | GAMMA_OUT
          exportEnv: 'false'

      - name: Assert ALPHA_OUT
        env:
          ACTUAL: ${{ steps.vault.outputs.ALPHA_OUT }}
        run: |
          echo "actual ALPHA_OUT: $ACTUAL"
          if [ "$ACTUAL" != "VALUE_ALPHA" ]; then
            echo "FAIL: expected 'VALUE_ALPHA' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS ALPHA_OUT"

      - name: Assert BETA_OUT
        env:
          ACTUAL: ${{ steps.vault.outputs.BETA_OUT }}
        run: |
          echo "actual BETA_OUT: $ACTUAL"
          if [ "$ACTUAL" != "VALUE_BETA" ]; then
            echo "FAIL: expected 'VALUE_BETA' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS BETA_OUT"

      - name: Assert GAMMA_OUT
        env:
          ACTUAL: ${{ steps.vault.outputs.GAMMA_OUT }}
        run: |
          echo "actual GAMMA_OUT: $ACTUAL"
          if [ "$ACTUAL" != "VALUE_GAMMA" ]; then
            echo "FAIL: expected 'VALUE_GAMMA' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS GAMMA_OUT"
