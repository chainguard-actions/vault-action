name: Test mTLS certificate inputs (caCertificate, clientCertificate, clientKey)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate self-signed CA and client cert for testing
        id: certgen
        run: |
          # Generate CA key and cert
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/ca-key.pem \
            -out /tmp/ca-cert.pem -days 1 -nodes \
            -subj "/CN=test-ca" 2>/dev/null

          # Generate client key and CSR
          openssl req -newkey rsa:2048 -keyout /tmp/client-key.pem \
            -out /tmp/client-csr.pem -nodes \
            -subj "/CN=test-client" 2>/dev/null

          # Sign client cert with CA
          openssl x509 -req -in /tmp/client-csr.pem \
            -CA /tmp/ca-cert.pem -CAkey /tmp/ca-key.pem \
            -CAcreateserial -out /tmp/client-cert.pem -days 1 2>/dev/null

          CA_B64=$(base64 -w 0 /tmp/ca-cert.pem)
          CLIENT_CERT_B64=$(base64 -w 0 /tmp/client-cert.pem)
          CLIENT_KEY_B64=$(base64 -w 0 /tmp/client-key.pem)

          echo "ca_b64=$CA_B64" >> $GITHUB_OUTPUT
          echo "client_cert_b64=$CLIENT_CERT_B64" >> $GITHUB_OUTPUT
          echo "client_key_b64=$CLIENT_KEY_B64" >> $GITHUB_OUTPUT
      - name: Start mock Vault server
        run: |
          mkdir -p /tmp/vault-mock
          cat > /tmp/vault-mock/server.py << 'EOF'
          import http.server, json

          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  self.rfile.read(length)
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({
                      "auth": {
                          "client_token": "mock-token",
                          "lease_duration": 3600,
                          "renewable": False,
                          "policies": ["default"]
                      }
                  }).encode())
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({
                      "data": {"value": "mock-secret"}
                  }).encode())
          server = http.server.HTTPServer(('127.0.0.1', 8200), Handler)
          server.serve_forever()
          EOF
          python3 /tmp/vault-mock/server.py &
          sleep 1
          echo "Mock Vault server started"
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'http://127.0.0.1:8200'
          method: 'token'
          token: 'mock-token'
          caCertificate: ${{ steps.certgen.outputs.ca_b64 }}
          clientCertificate: ${{ steps.certgen.outputs.client_cert_b64 }}
          clientKey: ${{ steps.certgen.outputs.client_key_b64 }}
          secrets: 'secret/data/test value | TEST_SECRET'
          tlsSkipVerify: 'true'
      - name: Assert inputs were accepted
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with caCertificate, clientCertificate, and clientKey inputs"
