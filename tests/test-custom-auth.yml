name: Test custom auth payload input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Vault dev server
        run: |
          docker run -d \
            --name vault \
            --network host \
            -e VAULT_DEV_ROOT_TOKEN_ID=root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.15 server -dev
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health > /dev/null 2>&1; then
              echo "Vault is ready"
              break
            fi
            sleep 1
          done

      - name: Configure userpass auth for custom payload test
        run: |
          docker exec vault vault auth enable userpass
          docker exec vault sh -c 'echo "path \"secret/*\" { capabilities = [\"read\"] }" | vault policy write myapp-policy -'
          docker exec vault vault write auth/userpass/users/customuser \
            password=custompass \
            policies=myapp-policy
          docker exec vault vault kv put secret/myapp/data value=custom-auth-secret

      - name: Test action with authPayload input
        id: vault
        uses: .
        with:
          url: http://127.0.0.1:8200
          method: userpass
          path: userpass
          authPayload: '{"password": "custompass"}'
          role: customuser
          secrets: secret/data/myapp/data value | CUSTOM_AUTH_VALUE
          tlsSkipVerify: "true"

      - name: Assert CUSTOM_AUTH_VALUE is set
        run: |
          echo "CUSTOM_AUTH_VALUE: $CUSTOM_AUTH_VALUE"
          if [ "$CUSTOM_AUTH_VALUE" != "custom-auth-secret" ]; then
            echo "FAIL: expected CUSTOM_AUTH_VALUE=custom-auth-secret, got $CUSTOM_AUTH_VALUE"
            exit 1
          fi
          echo "PASS"

      - name: Stop Vault
        if: always()
        run: docker rm -f vault || true
