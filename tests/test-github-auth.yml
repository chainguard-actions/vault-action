name: Test GitHub token authentication input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Vault dev server
        run: |
          docker run -d \
            --name vault \
            --network host \
            -e VAULT_DEV_ROOT_TOKEN_ID=root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.15 server -dev
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health > /dev/null 2>&1; then
              echo "Vault is ready"
              break
            fi
            echo "Waiting for Vault... ($i)"
            sleep 1
          done

      - name: Verify Vault is up (action will fail due to no GitHub auth configured, that is expected)
        run: |
          curl -sf http://127.0.0.1:8200/v1/sys/health
          echo "Vault is running"

      - name: Run action with github auth method (expected to fail - no GitHub auth configured)
        id: vault
        continue-on-error: true
        uses: .
        with:
          url: http://127.0.0.1:8200
          method: github
          githubToken: fake-github-token-for-input-coverage
          secrets: secret/data/myapp key | MY_KEY
          tlsSkipVerify: "true"
          ignoreNotFound: "true"
          exportEnv: "true"
          exportToken: "false"
          outputToken: "false"

      - name: Assert action was attempted (input coverage verified)
        run: |
          echo "Action step completed (with or without error - input coverage is the goal)"
          echo "PASS: githubToken input was passed to the action"
