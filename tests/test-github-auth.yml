name: Test GitHub token authentication input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Vault dev server
        run: |
          docker run -d \
            --name vault \
            --network host \
            -e VAULT_DEV_ROOT_TOKEN_ID=root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.15 server -dev
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health > /dev/null 2>&1; then
              echo "Vault is ready"
              break
            fi
            sleep 1
          done

      - name: Seed Vault with a secret
        run: |
          docker exec vault vault kv put secret/myapp/config value=github-auth-test

      - name: Test action with githubToken input (expect failure since no real GitHub auth configured)
        id: vault
        uses: .
        continue-on-error: true
        with:
          url: http://127.0.0.1:8200
          method: github
          githubToken: fake-github-token-for-input-coverage
          kubernetesTokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
          secrets: secret/data/myapp/config value | GITHUB_AUTH_VALUE
          tlsSkipVerify: "true"

      - name: Assert action attempted GitHub auth (failure is expected with fake token)
        run: |
          echo "outcome: ${{ steps.vault.outcome }}"
          # The action should fail because the fake token is invalid,
          # but the important thing is that the githubToken input was accepted
          if [ "${{ steps.vault.outcome }}" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "PASS: action failed as expected with invalid GitHub token"
          fi

      - name: Stop Vault
        if: always()
        run: docker rm -f vault || true
