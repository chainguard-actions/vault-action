name: Test extraHeaders and namespace inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'http://localhost:8200'
          method: 'token'
          token: 'fake-test-token'
          namespace: 'admin/test-namespace'
          extraHeaders: |
            X-Custom-Header: test-value
            X-Another-Header: another-value
          secrets: 'secret/data/test key'
      - name: Assert action ran (failed gracefully — no real Vault server)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Vault server available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
