name: Test secret encoding type input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Vault dev server
        run: |
          docker run -d \
            --name vault \
            --network host \
            -e VAULT_DEV_ROOT_TOKEN_ID=root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.15 server -dev
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health > /dev/null 2>&1; then
              echo "Vault is ready"
              break
            fi
            sleep 1
          done

      - name: Seed Vault with a base64-encoded secret
        run: |
          # Store a base64-encoded value in Vault
          B64_VALUE=$(echo -n "hello-world" | base64)
          docker exec vault vault kv put secret/myapp/encoded value="$B64_VALUE"

      - id: vault
        uses: .
        with:
          url: http://127.0.0.1:8200
          token: root
          secrets: secret/data/myapp/encoded value | ENCODED_VALUE
          secretEncodingType: base64
          tlsSkipVerify: "true"

      - name: Assert ENCODED_VALUE is decoded
        run: |
          echo "ENCODED_VALUE: $ENCODED_VALUE"
          if [ "$ENCODED_VALUE" != "hello-world" ]; then
            echo "FAIL: expected ENCODED_VALUE=hello-world, got $ENCODED_VALUE"
            exit 1
          fi
          echo "PASS"

      - name: Stop Vault
        if: always()
        run: docker rm -f vault || true
