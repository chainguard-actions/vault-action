name: Test userpass authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Vault dev server
        run: |
          docker run -d --name vault \
            -p 8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.15 server -dev
          sleep 5

      - name: Configure userpass and seed secret
        run: |
          # Enable userpass auth
          docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN=root vault \
            vault auth enable userpass
          # Create a policy
          docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN=root vault \
            vault policy write myapp-policy - <<'EOF'
          path "secret/*" {
            capabilities = ["read"]
          }
          EOF
          # Create user
          docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN=root vault \
            vault write auth/userpass/users/testuser password=testpass policies=myapp-policy
          # Seed a secret
          docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN=root vault \
            vault kv put secret/myapp dbpass=dbsecret

      - id: vault
        uses: .
        with:
          url: http://127.0.0.1:8200
          method: userpass
          username: testuser
          password: testpass
          secrets: secret/data/myapp dbpass | MY_DB_PASS
          tlsSkipVerify: "true"

      - name: Assert MY_DB_PASS env var is set
        run: |
          echo "MY_DB_PASS: $MY_DB_PASS"
          if [ "$MY_DB_PASS" != "dbsecret" ]; then
            echo "FAIL: expected MY_DB_PASS=dbsecret, got $MY_DB_PASS"
            exit 1
          fi
          echo "PASS"

      - name: Stop Vault
        if: always()
        run: docker rm -f vault || true
