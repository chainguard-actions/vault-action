name: Test Userpass authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Vault dev server
        run: |
          docker run -d \
            --name vault \
            --network host \
            -e VAULT_DEV_ROOT_TOKEN_ID=root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.15 server -dev
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health > /dev/null 2>&1; then
              echo "Vault is ready"
              break
            fi
            echo "Waiting for Vault... ($i)"
            sleep 1
          done

      - name: Configure Userpass and seed secret
        run: |
          # Enable userpass auth
          docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN=root vault \
            vault auth enable userpass
          # Create a policy
          docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN=root vault \
            sh -c 'echo "path \"secret/*\" { capabilities = [\"read\"] }" | vault policy write myapp-policy -'
          # Create user
          docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN=root vault \
            vault write auth/userpass/users/myuser \
              password=mypassword \
              policies=myapp-policy
          # Seed a secret
          docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN=root vault \
            vault kv put secret/myapp userkey=uservalue

      - id: vault
        uses: .
        with:
          url: http://127.0.0.1:8200
          method: userpass
          username: myuser
          password: mypassword
          secrets: secret/data/myapp userkey | USER_KEY
          tlsSkipVerify: "true"
          ignoreNotFound: "false"
          exportEnv: "true"
          exportToken: "false"
          outputToken: "false"

      - name: Assert USER_KEY is set
        run: |
          echo "USER_KEY: $USER_KEY"
          if [ "$USER_KEY" != "uservalue" ]; then
            echo "FAIL: expected USER_KEY=uservalue, got '$USER_KEY'"
            exit 1
          fi
          echo "PASS"
