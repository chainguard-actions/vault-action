name: Test userpass auth method inputs (username and password)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Vault server
        run: |
          mkdir -p /tmp/vault-mock
          cat > /tmp/vault-mock/server.py << 'EOF'
          import http.server, json

          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  self.rfile.read(length)
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({
                      "auth": {
                          "client_token": "mock-token",
                          "lease_duration": 3600,
                          "renewable": False,
                          "policies": ["default"]
                      }
                  }).encode())
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({
                      "data": {"value": "mock-secret"}
                  }).encode())
          server = http.server.HTTPServer(('127.0.0.1', 8200), Handler)
          server.serve_forever()
          EOF
          python3 /tmp/vault-mock/server.py &
          sleep 1
          echo "Mock Vault server started"
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'http://127.0.0.1:8200'
          method: 'userpass'
          username: 'testuser'
          password: 'testpassword'
          secrets: 'secret/data/test value | TEST_SECRET'
          tlsSkipVerify: 'true'
      - name: Assert inputs were accepted
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with username and password inputs"
