name: Test userpass authentication method
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault:1.15.0
        env:
          VAULT_DEV_ROOT_TOKEN_ID: testtoken
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Wait for Vault to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health > /dev/null 2>&1; then
              echo "Vault is ready"
              break
            fi
            echo "Waiting for Vault... attempt $i"
            sleep 2
          done

      - name: Configure Vault userpass auth and seed secrets
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: testtoken
        run: |
          # Enable userpass auth method
          curl -sf -X POST \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"userpass"}' \
            "$VAULT_ADDR/v1/sys/auth/userpass"

          # Create a policy for reading secrets
          curl -sf -X POST \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"policy":"path \"secret/*\" { capabilities = [\"read\", \"list\"] }"}' \
            "$VAULT_ADDR/v1/sys/policies/acl/read-secrets"

          # Create a user with the policy
          curl -sf -X POST \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"password":"testpassword","policies":["read-secrets"]}' \
            "$VAULT_ADDR/v1/auth/userpass/users/testuser"

          # Write a test secret
          curl -sf -X POST \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"data":{"userpass_secret":"USERPASS_SECRET_VALUE"}}' \
            "$VAULT_ADDR/v1/secret/data/userpass-test"

          echo "Userpass auth configured and secret written"

      - id: vault
        uses: .
        with:
          url: http://127.0.0.1:8200
          method: userpass
          username: testuser
          password: testpassword
          secrets: secret/data/userpass-test userpass_secret | USERPASS_SECRET
          exportEnv: 'false'

      - name: Assert userpass secret retrieved
        env:
          ACTUAL: ${{ steps.vault.outputs.USERPASS_SECRET }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "USERPASS_SECRET_VALUE" ]; then
            echo "FAIL: expected 'USERPASS_SECRET_VALUE' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
