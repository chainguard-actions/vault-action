name: Test ignoreNotFound - missing secrets do not fail the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault:1.15.0
        env:
          VAULT_DEV_ROOT_TOKEN_ID: testtoken
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Wait for Vault to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health > /dev/null 2>&1; then
              echo "Vault is ready"
              break
            fi
            echo "Waiting for Vault... attempt $i"
            sleep 2
          done

      - name: Seed Vault with one existing secret
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: testtoken
        run: |
          curl -sf -X POST \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"data":{"present_key":"PRESENT_VALUE"}}' \
            "$VAULT_ADDR/v1/secret/data/existing"
          echo "Secret written successfully"

      - name: Test that missing secret fails without ignoreNotFound
        id: vault_fail
        uses: .
        continue-on-error: true
        with:
          url: http://127.0.0.1:8200
          token: testtoken
          secrets: secret/data/does-not-exist missing_key | MISSING_SECRET
          exportEnv: 'false'

      - name: Assert action failed when secret not found
        env:
          OUTCOME: ${{ steps.vault_fail.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when secret not found but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when secret not found"

      - id: vault_ignore
        uses: .
        with:
          url: http://127.0.0.1:8200
          token: testtoken
          secrets: |
            secret/data/existing present_key | PRESENT_SECRET ;
            secret/data/does-not-exist missing_key | MISSING_SECRET
          ignoreNotFound: 'true'
          exportEnv: 'false'

      - name: Assert present secret is retrieved when ignoreNotFound is true
        env:
          ACTUAL: ${{ steps.vault_ignore.outputs.PRESENT_SECRET }}
        run: |
          echo "actual PRESENT_SECRET: $ACTUAL"
          if [ "$ACTUAL" != "PRESENT_VALUE" ]; then
            echo "FAIL: expected 'PRESENT_VALUE' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: present secret retrieved correctly"

      - name: Assert missing secret output is empty when ignoreNotFound is true
        env:
          ACTUAL: ${{ steps.vault_ignore.outputs.MISSING_SECRET }}
        run: |
          echo "actual MISSING_SECRET: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty output for missing secret but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: missing secret output is empty as expected"
