name: Test exportEnv false - secrets as outputs only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault:1.17
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: test-root-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        options: >-
          --cap-add=IPC_LOCK
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Wait for Vault to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health; then
              echo "Vault is ready"
              break
            fi
            echo "Waiting for Vault... attempt $i"
            sleep 2
          done

      - name: Seed Vault with test secret
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: test-root-token
        run: |
          curl -sf \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"data": {"SECRET_VALUE": "output-only-secret"}}' \
            "$VAULT_ADDR/v1/secret/data/myapp"

      - id: vault
        uses: .
        with:
          url: http://127.0.0.1:8200
          method: token
          token: test-root-token
          exportEnv: 'false'
          secrets: |
            secret/data/myapp SECRET_VALUE

      - name: Assert SECRET_VALUE is available as step output
        env:
          ACTUAL: ${{ steps.vault.outputs.SECRET_VALUE }}
        run: |
          echo "SECRET_VALUE output: $ACTUAL"
          if [ "$ACTUAL" != "output-only-secret" ]; then
            echo "FAIL: expected SECRET_VALUE output='output-only-secret', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert SECRET_VALUE is NOT set as env var
        run: |
          echo "SECRET_VALUE env var: '${SECRET_VALUE:-}'"
          if [ -n "${SECRET_VALUE:-}" ]; then
            echo "FAIL: expected SECRET_VALUE to NOT be set as env var when exportEnv=false"
            exit 1
          fi
          echo "PASS: SECRET_VALUE is not in environment"
