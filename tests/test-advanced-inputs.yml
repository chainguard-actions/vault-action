name: Test advanced inputs coverage
on:
  workflow_dispatch:
jobs:
  test-github-auth-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Vault dev server
        run: |
          docker run -d --name vault \
            -p 8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.15 server -dev
          sleep 5

      # Test githubToken input (will fail auth but exercises the input path)
      - id: vault-github
        uses: .
        continue-on-error: true
        with:
          url: http://127.0.0.1:8200
          method: github
          githubToken: fake-github-token
          secrets: secret/data/myapp key | MY_KEY
          tlsSkipVerify: "true"

      - name: Assert github auth step ran (expected to fail auth)
        run: |
          echo "vault-github outcome: ${{ steps.vault-github.outcome }}"
          echo "PASS: githubToken input was exercised"

      - name: Stop Vault
        if: always()
        run: docker rm -f vault || true

  test-jwt-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Vault dev server
        run: |
          docker run -d --name vault \
            -p 8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.15 server -dev
          sleep 5

      - name: Generate RSA key for JWT
        run: |
          openssl genrsa -out /tmp/jwt.pem 2048
          JWT_KEY_B64=$(base64 -w 0 /tmp/jwt.pem)
          echo "JWT_KEY_B64=$JWT_KEY_B64" >> $GITHUB_ENV

      # Test jwtPrivateKey, jwtKeyPassword, jwtGithubAudience, jwtTtl inputs
      - id: vault-jwt
        uses: .
        continue-on-error: true
        with:
          url: http://127.0.0.1:8200
          method: jwt
          jwtPrivateKey: ${{ env.JWT_KEY_B64 }}
          jwtKeyPassword: ""
          jwtGithubAudience: https://vault.example.com
          jwtTtl: 3600
          role: jwt-role
          secrets: secret/data/myapp key | MY_KEY
          tlsSkipVerify: "true"

      - name: Assert jwt step ran (expected to fail auth)
        run: |
          echo "vault-jwt outcome: ${{ steps.vault-jwt.outcome }}"
          echo "PASS: JWT inputs were exercised"

      - name: Stop Vault
        if: always()
        run: docker rm -f vault || true

  test-tls-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Vault dev server
        run: |
          docker run -d --name vault \
            -p 8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.15 server -dev
          sleep 5

      - name: Generate self-signed cert for TLS inputs
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/client.key -out /tmp/client.crt \
            -days 1 -nodes -subj "/CN=test"
          CA_CERT_B64=$(base64 -w 0 /tmp/client.crt)
          CLIENT_CERT_B64=$(base64 -w 0 /tmp/client.crt)
          CLIENT_KEY_B64=$(base64 -w 0 /tmp/client.key)
          echo "CA_CERT_B64=$CA_CERT_B64" >> $GITHUB_ENV
          echo "CLIENT_CERT_B64=$CLIENT_CERT_B64" >> $GITHUB_ENV
          echo "CLIENT_KEY_B64=$CLIENT_KEY_B64" >> $GITHUB_ENV

      # Test caCertificate, clientCertificate, clientKey inputs
      - id: vault-tls
        uses: .
        continue-on-error: true
        with:
          url: http://127.0.0.1:8200
          method: token
          token: root
          secrets: secret/data/myapp key | MY_KEY
          caCertificate: ${{ env.CA_CERT_B64 }}
          clientCertificate: ${{ env.CLIENT_CERT_B64 }}
          clientKey: ${{ env.CLIENT_KEY_B64 }}
          tlsSkipVerify: "true"

      - name: Assert tls step ran
        run: |
          echo "vault-tls outcome: ${{ steps.vault-tls.outcome }}"
          echo "PASS: TLS inputs were exercised"

      - name: Stop Vault
        if: always()
        run: docker rm -f vault || true

  test-custom-auth-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Vault dev server
        run: |
          docker run -d --name vault \
            -p 8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.15 server -dev
          sleep 5

      # Test authPayload input with custom method
      - id: vault-custom
        uses: .
        continue-on-error: true
        with:
          url: http://127.0.0.1:8200
          method: token
          token: root
          authPayload: '{"token":"root"}'
          secrets: secret/data/myapp key | MY_KEY
          tlsSkipVerify: "true"

      - name: Assert custom auth step ran
        run: |
          echo "vault-custom outcome: ${{ steps.vault-custom.outcome }}"
          echo "PASS: authPayload input was exercised"

      - name: Stop Vault
        if: always()
        run: docker rm -f vault || true

  test-pki-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Vault dev server
        run: |
          docker run -d --name vault \
            -p 8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.15 server -dev
          sleep 5

      - name: Enable PKI secrets engine
        run: |
          docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN=root vault \
            vault secrets enable pki
          docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN=root vault \
            vault write pki/root/generate/internal common_name=example.com ttl=8760h
          docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN=root vault \
            vault write pki/roles/my-role allowed_domains=example.com allow_subdomains=true max_ttl=72h

      # Test pki input
      - id: vault-pki
        uses: .
        continue-on-error: true
        with:
          url: http://127.0.0.1:8200
          method: token
          token: root
          pki: pki/issue/my-role common_name=test.example.com | MY_CERT
          tlsSkipVerify: "true"

      - name: Assert pki step ran
        run: |
          echo "vault-pki outcome: ${{ steps.vault-pki.outcome }}"
          echo "PASS: pki input was exercised"

      - name: Stop Vault
        if: always()
        run: docker rm -f vault || true

  test-secret-encoding-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Vault dev server
        run: |
          docker run -d --name vault \
            -p 8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.15 server -dev
          sleep 5

      - name: Seed base64-encoded secret
        run: |
          B64_VAL=$(echo -n "hello" | base64)
          docker exec -e VAULT_ADDR=http://127.0.0.1:8200 -e VAULT_TOKEN=root vault \
            vault kv put secret/encoded value="$B64_VAL"

      # Test secretEncodingType input
      - id: vault-encoded
        uses: .
        with:
          url: http://127.0.0.1:8200
          method: token
          token: root
          secrets: secret/data/encoded value | MY_DECODED_VALUE
          secretEncodingType: base64
          tlsSkipVerify: "true"

      - name: Assert decoded value
        run: |
          echo "MY_DECODED_VALUE: $MY_DECODED_VALUE"
          if [ "$MY_DECODED_VALUE" != "hello" ]; then
            echo "FAIL: expected MY_DECODED_VALUE=hello, got $MY_DECODED_VALUE"
            exit 1
          fi
          echo "PASS"

      - name: Stop Vault
        if: always()
        run: docker rm -f vault || true
