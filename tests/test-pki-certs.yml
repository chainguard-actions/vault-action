name: Test PKI certificate generation input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Vault server for PKI
        run: |
          mkdir -p /tmp/vault-mock
          cat > /tmp/vault-mock/server.py << 'EOF'
          import http.server, json

          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  self.rfile.read(length)
                  # Return a mock PKI certificate response
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({
                      "data": {
                          "certificate": "-----BEGIN CERTIFICATE-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA\n-----END CERTIFICATE-----",
                          "private_key": "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY-----",
                          "ca_chain": ["-----BEGIN CERTIFICATE-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA\n-----END CERTIFICATE-----"],
                          "serial_number": "01:02:03:04:05:06:07:08"
                      },
                      "auth": {
                          "client_token": "mock-token",
                          "lease_duration": 3600,
                          "renewable": False,
                          "policies": ["default"]
                      }
                  }).encode())
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({
                      "data": {"value": "mock-secret"}
                  }).encode())
          server = http.server.HTTPServer(('127.0.0.1', 8200), Handler)
          server.serve_forever()
          EOF
          python3 /tmp/vault-mock/server.py &
          sleep 1
          echo "Mock Vault server started"
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'http://127.0.0.1:8200'
          method: 'token'
          token: 'mock-token'
          pki: 'pki/issue/my-role common_name=example.com | MY_CERT'
          tlsSkipVerify: 'true'
      - name: Assert inputs were accepted
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with pki input"
