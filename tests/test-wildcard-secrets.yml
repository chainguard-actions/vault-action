name: Test wildcard secret retrieval
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault:1.15.0
        env:
          VAULT_DEV_ROOT_TOKEN_ID: testtoken
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Wait for Vault to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health > /dev/null 2>&1; then
              echo "Vault is ready"
              break
            fi
            echo "Waiting for Vault... attempt $i"
            sleep 2
          done

      - name: Seed Vault with multi-key secret
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: testtoken
        run: |
          # Write a secret with multiple keys to test wildcard retrieval
          curl -sf -X POST \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"data":{"foo":"bar","baz":"qux"}}' \
            "$VAULT_ADDR/v1/secret/data/wildcard-test"
          echo "Secret written successfully"

      - id: vault
        uses: .
        with:
          url: http://127.0.0.1:8200
          token: testtoken
          secrets: secret/data/wildcard-test *
          exportEnv: 'false'

      - name: Assert FOO output from wildcard
        env:
          ACTUAL: ${{ steps.vault.outputs.FOO }}
        run: |
          echo "actual FOO: $ACTUAL"
          if [ "$ACTUAL" != "bar" ]; then
            echo "FAIL: expected 'bar' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS FOO"

      - name: Assert BAZ output from wildcard
        env:
          ACTUAL: ${{ steps.vault.outputs.BAZ }}
        run: |
          echo "actual BAZ: $ACTUAL"
          if [ "$ACTUAL" != "qux" ]; then
            echo "FAIL: expected 'qux' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS BAZ"
