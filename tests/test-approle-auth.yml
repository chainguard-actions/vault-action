name: Test AppRole authentication method
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault:1.15.0
        env:
          VAULT_DEV_ROOT_TOKEN_ID: testtoken
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Wait for Vault to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health > /dev/null 2>&1; then
              echo "Vault is ready"
              break
            fi
            echo "Waiting for Vault... attempt $i"
            sleep 2
          done

      - name: Configure Vault AppRole and seed secrets
        id: setup
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: testtoken
        run: |
          # Enable AppRole auth method
          curl -sf -X POST \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"approle"}' \
            "$VAULT_ADDR/v1/sys/auth/approle"

          # Create a policy for reading secrets
          curl -sf -X POST \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"policy":"path \"secret/*\" { capabilities = [\"read\", \"list\"] }"}' \
            "$VAULT_ADDR/v1/sys/policies/acl/read-secrets"

          # Create an AppRole with the policy
          curl -sf -X POST \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"policies":["read-secrets"],"token_ttl":"1h"}' \
            "$VAULT_ADDR/v1/auth/approle/role/myapp"

          # Get the role ID
          ROLE_ID=$(curl -sf \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            "$VAULT_ADDR/v1/auth/approle/role/myapp/role-id" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['data']['role_id'])")
          echo "role_id=$ROLE_ID" >> "$GITHUB_OUTPUT"

          # Generate a secret ID
          SECRET_ID=$(curl -sf -X POST \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            "$VAULT_ADDR/v1/auth/approle/role/myapp/secret-id" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['data']['secret_id'])")
          echo "secret_id=$SECRET_ID" >> "$GITHUB_OUTPUT"

          # Write a test secret
          curl -sf -X POST \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"data":{"approle_secret":"APPROLE_SECRET_VALUE"}}' \
            "$VAULT_ADDR/v1/secret/data/approle-test"

          echo "AppRole configured and secret written"

      - id: vault
        uses: .
        with:
          url: http://127.0.0.1:8200
          method: approle
          roleId: ${{ steps.setup.outputs.role_id }}
          secretId: ${{ steps.setup.outputs.secret_id }}
          secrets: secret/data/approle-test approle_secret | APPROLE_SECRET
          exportEnv: 'false'

      - name: Assert AppRole secret retrieved
        env:
          ACTUAL: ${{ steps.vault.outputs.APPROLE_SECRET }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "APPROLE_SECRET_VALUE" ]; then
            echo "FAIL: expected 'APPROLE_SECRET_VALUE' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
