name: Test AppRole authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault:1.17
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: test-root-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        options: >-
          --cap-add=IPC_LOCK
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Wait for Vault to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health; then
              echo "Vault is ready"
              break
            fi
            echo "Waiting for Vault... attempt $i"
            sleep 2
          done

      - name: Configure Vault AppRole and seed secret
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: test-root-token
        run: |
          # Enable AppRole auth method
          curl -sf \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"type": "approle"}' \
            "$VAULT_ADDR/v1/sys/auth/approle"

          # Create a policy
          curl -sf \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -X PUT \
            -d '{"policy": "path \"secret/*\" { capabilities = [\"read\", \"list\"] }"}' \
            "$VAULT_ADDR/v1/sys/policies/acl/myapp-policy"

          # Create an AppRole
          curl -sf \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"policies": ["myapp-policy"], "token_ttl": "1h"}' \
            "$VAULT_ADDR/v1/auth/approle/role/myapp"

          # Seed the secret
          curl -sf \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"data": {"DB_PASSWORD": "supersecret"}}' \
            "$VAULT_ADDR/v1/secret/data/myapp"

          # Retrieve role-id and secret-id and write to files for next steps
          ROLE_ID=$(curl -sf \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            "$VAULT_ADDR/v1/auth/approle/role/myapp/role-id" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['role_id'])")
          echo "ROLE_ID=$ROLE_ID" >> $GITHUB_ENV

          SECRET_ID=$(curl -sf \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -X POST \
            "$VAULT_ADDR/v1/auth/approle/role/myapp/secret-id" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['secret_id'])")
          echo "SECRET_ID=$SECRET_ID" >> $GITHUB_ENV

      - id: vault
        uses: .
        with:
          url: http://127.0.0.1:8200
          method: approle
          roleId: ${{ env.ROLE_ID }}
          secretId: ${{ env.SECRET_ID }}
          secrets: |
            secret/data/myapp DB_PASSWORD

      - name: Assert DB_PASSWORD env var is set
        run: |
          echo "DB_PASSWORD=$DB_PASSWORD"
          if [ "$DB_PASSWORD" != "supersecret" ]; then
            echo "FAIL: expected DB_PASSWORD='supersecret', got '$DB_PASSWORD'"
            exit 1
          fi
          echo "PASS"
