name: Test token auth with secrets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Vault dev server
        run: |
          docker run -d \
            --name vault \
            --network host \
            -e VAULT_DEV_ROOT_TOKEN_ID=root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.15 server -dev
          # Wait for Vault to be ready
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health > /dev/null 2>&1; then
              echo "Vault is ready"
              break
            fi
            sleep 1
          done

      - name: Seed Vault with a secret
        run: |
          export VAULT_ADDR=http://127.0.0.1:8200
          export VAULT_TOKEN=root
          docker exec vault vault kv put secret/myapp/config username=testuser password=testpass

      - id: vault
        uses: .
        with:
          url: http://127.0.0.1:8200
          token: root
          secrets: secret/data/myapp/config username | MY_USERNAME ; secret/data/myapp/config password | MY_PASSWORD
          namespace: ""
          extraHeaders: |
            X-Custom-Header: test-value
          exportEnv: "true"
          exportToken: "false"
          outputToken: "false"
          tlsSkipVerify: "true"
          ignoreNotFound: "false"
          secretEncodingType: ""

      - name: Assert MY_USERNAME is set
        run: |
          echo "MY_USERNAME: $MY_USERNAME"
          if [ "$MY_USERNAME" != "testuser" ]; then
            echo "FAIL: expected MY_USERNAME=testuser, got $MY_USERNAME"
            exit 1
          fi
          echo "PASS"

      - name: Assert MY_PASSWORD is set
        run: |
          echo "MY_PASSWORD: $MY_PASSWORD"
          if [ "$MY_PASSWORD" != "testpass" ]; then
            echo "FAIL: expected MY_PASSWORD=testpass, got $MY_PASSWORD"
            exit 1
          fi
          echo "PASS"

      - name: Stop Vault
        if: always()
        run: docker rm -f vault || true
