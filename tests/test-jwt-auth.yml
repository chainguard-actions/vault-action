name: Test jwtPrivateKey, jwtKeyPassword, and jwtGithubAudience inputs (JWT auth)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate a test RSA key for JWT auth
        run: |
          openssl genrsa -out /tmp/test-jwt-key.pem 2048 2>/dev/null
          # Encode the key as base64 for the action input
          base64 -w 0 /tmp/test-jwt-key.pem > /tmp/test-jwt-key-b64.txt
          echo "JWT_PRIVATE_KEY=$(cat /tmp/test-jwt-key-b64.txt)" >> $GITHUB_ENV
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'http://localhost:8200'
          method: 'jwt'
          role: 'test-jwt-role'
          jwtPrivateKey: ${{ env.JWT_PRIVATE_KEY }}
          jwtKeyPassword: ''
          jwtGithubAudience: 'https://vault.example.com'
          jwtTtl: 3600
          secrets: 'secret/data/test key'
      - name: Assert action ran (failed gracefully — no real Vault server with JWT auth)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Vault server available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
