name: Test JWT authentication input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate RSA key pair for JWT
        run: |
          # Generate a private key
          openssl genrsa -out /tmp/jwt_key.pem 2048
          # Base64 encode it
          JWT_PRIVATE_KEY=$(base64 -w 0 /tmp/jwt_key.pem)
          echo "JWT_PRIVATE_KEY=$JWT_PRIVATE_KEY" >> $GITHUB_ENV

      - name: Start Vault dev server
        run: |
          docker run -d \
            --name vault \
            --network host \
            -e VAULT_DEV_ROOT_TOKEN_ID=root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.15 server -dev
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health > /dev/null 2>&1; then
              echo "Vault is ready"
              break
            fi
            echo "Waiting for Vault... ($i)"
            sleep 1
          done

      - name: Run action with JWT auth method (expected to fail - no JWT auth configured)
        id: vault
        continue-on-error: true
        uses: .
        with:
          url: http://127.0.0.1:8200
          method: jwt
          role: my-jwt-role
          jwtPrivateKey: ${{ env.JWT_PRIVATE_KEY }}
          jwtKeyPassword: ""
          jwtGithubAudience: https://github.com/my-org
          jwtTtl: 3600
          secrets: secret/data/myapp key | MY_KEY
          tlsSkipVerify: "true"
          ignoreNotFound: "true"
          exportEnv: "true"
          exportToken: "false"
          outputToken: "false"

      - name: Assert action was attempted (input coverage verified)
        run: |
          echo "Action step completed (with or without error - input coverage is the goal)"
          echo "PASS: jwtPrivateKey, jwtKeyPassword, jwtGithubAudience, jwtTtl inputs were passed to the action"
